[package]
name = "uperf-sfanalysis"
version = "0.1.0"
edition = "2021"
description = "SfAnalysis injection library (Rust rewrite of libsfanalysis.so). AGENT.md §12.1, M8."
license = "Apache-2.0"
publish = false

[lib]
# Force the cdylib output name to `libsfanalysis_rs.so` so it matches the
# upstream vendor binary's naming convention. Without this, cargo would
# emit `libuperf_sfanalysis.so` (auto-derived from the package name) and
# every reference in `build.sh` / `magisk/customize.sh` would have to
# track the rename.
name = "sfanalysis_rs"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
once_cell = "1"

# Build profile: same as the uperf workspace — small, stripped, LTO.
[profile.release]
inherits = "workspace"

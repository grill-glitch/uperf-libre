[package]
name = "uperf-core"
version = "0.1.0"
edition = "2021"
publish = false

# AGENT.md §4, §3.2: keep deps minimal and only on the host's stable surface.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
once_cell = "1"
parking_lot = "0.12"
thiserror = "1"

[dev-dependencies]
pretty_assertions = "1"

# Static C archive for the C++ supervisor to link.
[lib]
crate-type = ["staticlib"]